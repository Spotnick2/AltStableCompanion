name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Release, not Debug: what a tag will build, so a Release-only failure shows here.
      - name: Build
        run: dotnet build -warnaserror --nologo -c Release
      - name: Test
        run: dotnet test --no-build --nologo -c Release
